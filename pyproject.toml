[project]
name = "induction-thermal-optimizer"
version = "0.0.1"
description = "Self-optimizing pipeline: OpenSCAD -> FEMM -> OpenFOAM -> Optuna"
requires-python = ">=3.10"
dependencies = ["numpy", "pydantic", "typer", "rich", "optuna"]

[project.scripts]
ito = "ito.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
